# Configuración para usar Alembic desde la consola, por ejemplo:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "descripción"
# La URL sale de DATABASE_URL (o JOBS_DB_PATH); la app aplica las migraciones sola al conectarse.
[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
path_separator = os
