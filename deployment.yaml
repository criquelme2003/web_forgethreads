apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-forgethreads-data
  namespace: criquelme
spec:
  # Resultados descargados del cluster (CSV de caminos). La base de datos está en postgres.yaml.
  # CephFS: el volumen sobrevive a reinicios y reprogramaciones del pod en otro nodo.
  storageClassName: csi-cephfs-sc
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-forgethreads
  namespace: criquelme
  labels:
    app: wf-deploy
spec:
  # Recreate: el volumen de resultados es ReadWriteOnce, así que el pod viejo debe soltarlo
  # antes de que arranque el nuevo.
  replicas: 1
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: web-forgethreads

  template:
    metadata:
      labels:
        app: web-forgethreads
    spec:
      containers:
      - name: web-forgethreads
        image: ghcr.io/criquelme2003/web_forgethreads_image:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        envFrom:
          - secretRef:
              name: wfsecrets
        # `env` tiene prioridad sobre `envFrom`.
        env:
          # Base PostgreSQL (postgres.yaml). La contraseña sale del secret wf-postgres y se
          # interpola con $(...): es hexadecimal, así que no hay que escaparla en la URL.
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: wf-postgres
                key: POSTGRES_PASSWORD
          - name: DATABASE_URL
            value: postgresql://wf:$(POSTGRES_PASSWORD)@wf-postgres:5432/wf
          # El volumen guarda los resultados descargados del cluster (CSV de caminos y de barridos).
          - name: FE_RESULTS_DIR
            value: /code/data/fe_results
          - name: SWEEP_RESULTS_DIR
            value: /code/data/sweep_results
        volumeMounts:
          - name: data
            mountPath: /code/data
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /docs
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /docs
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: web-forgethreads-data

---
apiVersion: v1
kind: Service
metadata: 
  name: web-forgethreads
  namespace: criquelme
spec:
  selector:
    app: web-forgethreads
  ports: 
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-forgethreads-ingress
  namespace: criquelme
  annotations:

    external-dns.alpha.kubernetes.io/hostname: web-forgethreads.inf.uct.cl
    external-dns.alpha.kubernetes.io/target: proxy.inf.uct.cl
    external-dns.alpha.kubernetes.io/ttl: "1"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx          
  tls:
    - hosts: [ web-forgethreads.inf.uct.cl ]
      secretName: inf-uct-cl-tls
  rules:
    - host: web-forgethreads.inf.uct.cl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-forgethreads
                port:
                  number: 80
 


