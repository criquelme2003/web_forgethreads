<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión — forgethreads</title>
  <style>
    :root{ --bg:#f8f9fb; --card:#fff; --border:#e5e7eb; --text:#111827; --muted:#6b7280; --accent:#1f2937; --radius:8px; --ring:#93c5fd; }
    *{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
    .topbar{border-bottom:1px solid var(--border);background:#fff}
    .topbar-inner{max-width:960px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
    .brand{font-weight:600;font-size:15px;letter-spacing:.02em} .brand span{font-weight:400;color:var(--muted)}
    .nav{font-size:13px;color:var(--muted);display:flex;gap:16px}
    .nav a{text-decoration:none;color:inherit;border-bottom:1px solid transparent;padding-bottom:2px}
    .nav a:hover{color:var(--text);border-color:var(--border)}
    .wrap{max-width:420px;margin:48px auto;padding:0 20px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px}
    h1{margin:0 0 4px;font-size:20px;font-weight:650;letter-spacing:-.015em}
    .sub{margin:0 0 18px;color:var(--muted);font-size:13.5px}
    form{display:grid;gap:14px}
    .field{display:grid;gap:6px}
    .field label{font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#374151}
    .field input{width:100%;padding:10px 11px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;outline:none}
    .field input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px var(--ring)}
    button{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:10px 14px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer}
    button:hover{background:#111827} button:disabled{opacity:.6;cursor:not-allowed}
    .status{font-size:13.5px;min-height:1.2em} .ok{color:#065f46} .err{color:#991b1b} .muted{color:var(--muted)}
    .foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">forgethreads <span>· acceso</span></div>
      <nav class="nav">
        <a href="/front/parameters">Parámetros</a>
        <a href="/front/gpu_status">GPU</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div class="card">
      <h1>Iniciar sesión</h1>
      <p class="sub">Accede para encolar tareas MaxMin.</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" type="text" name="username" required autocomplete="username" placeholder="usuario" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="submit" id="btn">Entrar</button>
        <div id="message" class="status muted" role="status" aria-live="polite"></div>
      </form>
      <div class="foot">
        <span>POST <span class="mono">/auth/login</span></span>
        <span class="mono">v1</span>
      </div>
    </div>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const msg = document.getElementById("message");
    const btn = document.getElementById("btn");
    function setStatus(t,k){ msg.textContent=t; msg.className='status '+(k||'muted'); }
    // si ya hay redirección pendiente ?next=
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/front/parameters';
    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      setStatus('', 'muted');
      btn.disabled=true; btn.textContent='Entrando…';
      const fd = new FormData(form);
      try{
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: fd.get("username"), password: fd.get("password") }),
        });
        if(res.ok){
          setStatus('Sesión iniciada. Redirigiendo…', 'ok');
          setTimeout(()=>{ location.href = next; }, 400);
        } else {
          const body = await res.json().catch(()=>({}));
          setStatus(body.detail || 'Credenciales inválidas.', 'err');
        }
      } catch{
        setStatus('Error de red.', 'err');
      } finally {
        btn.disabled=false; btn.textContent='Entrar';
      }
    });
  </script>
</body>
</html>
